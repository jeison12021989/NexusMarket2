spring.application.name=NexusMarket

# MySQL connection. The password is NOT stored in the repository: it is
# read from the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate/JPA
# "update" lets Hibernate create/adjust the tables from the entities
# while developing. Use "validate" plus migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The controllers return entities, so lazy collections (order details,
# cart items, ...) must still be readable while the JSON is written.
spring.jpa.open-in-view=true
